# 本项目自有服务的编排：统一文献检索微服务（OpenAlex + Crossref + Semantic Scholar）。
#
# Dify 本体不在这里编排——它有自己的一套 docker compose（见 deploy/README.md）。
# 推荐把本服务和 Dify 接到同一个 docker 网络，Dify 用内网地址 http://litsearch:8000 调它，
# 不必公网暴露本服务。
#
# 单独启动：
#   cd 仓库根目录
#   cp deploy/.env.example deploy/.env    # 可选：填 OPENALEX_MAILTO / S2_API_KEY
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#   curl "http://localhost:8000/search_all?q=digital+humanities&limit=3"

services:
  litsearch:
    build:
      context: ..                       # 仓库根，Dockerfile 里按 tools/... 拷贝
      dockerfile: deploy/search/Dockerfile
    image: lit-navigator/litsearch:latest
    container_name: litsearch
    restart: unless-stopped
    environment:
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      S2_API_KEY: ${S2_API_KEY:-}
    ports:
      - "8000:8000"                     # 若只给同网络的 Dify 用，可删掉这行不对外暴露
    networks:
      - lit-net

networks:
  lit-net:
    driver: bridge
    # 若要与 Dify 同网：先 `docker network create lit-net`，
    # 并在 Dify 的 compose 里把服务加入该外部网络；然后把上面改为：
    # lit-net:
    #   external: true
